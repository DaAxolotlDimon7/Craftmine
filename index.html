<!DOCTYPE html><html><head><style>body{margin:0;overflow:hidden;background:#8bf;user-select:none}#i{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:rgba(0,0,0,.6);padding:8px;border-radius:4px;z-index:9}.s{width:55px;height:40px;border:2px solid #555;cursor:pointer;display:flex;align-items:center;justify-content:center;font:bold 11px sans-serif;color:#fff;text-align:center}.s.a{border-color:#fff}#w{position:absolute;width:100vw;height:100vh;perspective:600px}#c{position:absolute;width:100%;height:100%;transform-style:preserve-3d}</style></head><body><div id="i"></div><div id="w"><div id="c"></div></div><script>let W=40,M={},px=0,py=-80,pz=0,rx=-20,ry=0,k={},sel=1,types={1:{n:'Grass',c:'#5a3'},2:{n:'Dirt',c:'#853'},3:{n:'Water',c:'rgba(0,120,255,0.7)'},4:{n:'Wood',c:'#a74'},5:{n:'Leaf',c:'#282'}};const inv=document.getElementById('i');Object.keys(types).forEach(id=>{let s=document.createElement('div');s.className='s'+(id==sel?' a':'');s.style.background=types[id].c;s.textContent=types[id].n;s.onclick=()=>{document.querySelectorAll('.s').forEach(e=>e.classList.remove('a'));s.classList.add('a');sel=parseInt(id)};inv.appendChild(s)});function face(x,y,z,tx,ty,fI){let f=document.createElement('div');f.style.cssText=`position:absolute;width:40px;height:40px;border:0.5px solid rgba(0,0,0,0.1);transform:translate3d(${x}px,${y}px,${z}px) rotateX(${tx}deg) rotateY(${ty}deg);background:inherit`;f.dataset.f=fI;return f}function draw(x,y,z,id){let key=`${x},${y},${z}`;if(M[key]){M[key].remove();delete M[key]}if(!id)return;let d=document.createElement('div');d.style.cssText=`position:absolute;width:40px;height:40px;transform-style:preserve-3d;transform:translate3d(${x}px,${y}px,${z}px);background:${types[id].c}`;d.appendChild(face(0,0,20,0,0,0));d.appendChild(face(0,0,-20,0,180,1));d.appendChild(face(-20,0,0,0,-90,2));d.appendChild(face(20,0,0,0,90,3));d.appendChild(face(0,-20,0,90,0,4));d.appendChild(face(0,20,0,-90,0,5));d.onmousedown=(e)=>{e.stopPropagation();let fI=parseInt(e.target.dataset.f);if(e.button===0)draw(x,y,z,0);if(e.button===2){let nx=x,ny=y,nz=z;if(fI===0)nz+=W;if(fI===1)nz-=W;if(fI===2)nx-=W;if(fI===3)nx+=W;if(fI===4)ny-=W;if(fI===5)ny+=W;draw(nx,ny,nz,sel)}};document.getElementById('c').appendChild(d);M[key]=d}document.addEventListener('contextmenu',e=>e.preventDefault());let highestY=0;for(let x=-5;x<=5;x++)for(let z=-5;z<=5;z++){let h=Math.floor((Math.sin(x*0.6)+Math.cos(z*0.6))*1)+1;for(let y=0;y<=h;y++){draw(x*W,-y*W,z*W,y===h?1:2);if(x===0&&z===0)highestY=Math.max(highestY,h)}if(x===-2&&z===2){for(let th=1;th<=3;th++)draw(x*W,-(h+th)*W,z*W,4);for(let lx=-1;lx<=1;lx++)for(let lz=-1;lz<=1;lz++)draw((x+lx)*W,-(h+4)*W,(z+lz)*W,5)}if(x===2&&z===-2)draw(x*W,-(h+1)*W,z*W,3)}py=-(highestY*W)-60;window.onkeydown=e=>k[e.key.toLowerCase()]=1;window.onkeyup=e=>k[e.key.toLowerCase()]=0;function loop(t){let s=2.5;if(k['w']){px-=s*Math.sin(ry*Math.PI/180);pz+=s*Math.cos(ry*Math.PI/180)}if(k['s']){px+=s*Math.sin(ry*Math.PI/180);pz-=s*Math.cos(ry*Math.PI/180)}if(k['a']){px-=s*Math.cos(ry*Math.PI/180);pz-=s*Math.sin(ry*Math.PI/180)}if(k['d']){px+=s*Math.cos(ry*Math.PI/180);pz+=s*Math.sin(ry*Math.PI/180)}if(k[' '])py-=s;if(k['shift'])py+=s;if(k['arrowleft'])ry-=2;if(k['arrowright'])ry+=2;if(k['arrowup'])rx=Math.min(90,rx+2);if(k['arrowdown'])rx=Math.max(-90,rx-2);Object.keys(M).forEach(key=>{if(M[key]&&M[key].style.background.includes('rgba(0,120')){let p=key.split(',').map(Number);M[key].style.transform=`translate3d(${p[0]}px,${p[1]+Math.sin(t*0.004+p[0])*3}px,${p[2]}px)`}});document.getElementById('c').style.transform=`translate3d(50vw,50vh,0) rotateX(${rx}deg) rotateY(${ry}deg) translate3d(${-px}px,${-py}px,${-pz}px)`;requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
