<!DOCTYPE html><html><head><style>body{margin:0;overflow:hidden;background:#8bf}#i{position:fixed;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:5px;background:rgba(0,0,0,.6);padding:8px;border-radius:4px;z-index:9}.s{width:40px;height:40px;border:2px solid #555;cursor:pointer;display:flex;align-items:center;justify-content:center;font:bold 12px sans-serif;color:#fff}.s.a{border-color:#fff}#w{position:absolute;width:100vw;height:100vh;perspective:800px}#c{position:absolute;width:100%;height:100%;transform-style:preserve-3d;transform:translateZ(-400px) rotateX(-20px) rotateY(0deg)}.b{position:absolute;width:40px;height:40px;transform-style:preserve-3d}.f{position:absolute;width:40px;height:40px;border:.5px solid rgba(0,0,0,.15)}</style></head><body><div id="i"></div><div id="w"><div id="c"></div></div><script>let W=40,M={},px=200,py=80,pz=200,rx=-20,ry=0,k={},sel=1,types={1:{n:'Grass',c:'#5a3'},2:{n:'Dirt',c:'#853'},3:{n:'Water',c:'rgba(0,100,255,0.7)',w:1},4:{n:'Wood',c:'#a74'},5:{n:'Leaves',c:'#282'}};const inv=document.getElementById('i');Object.keys(types).forEach(id=>{let s=document.createElement('div');s.className='s'+(id==sel?' a':'');s.style.background=types[id].c;s.textContent=types[id].n[0];s.onclick=()=>{document.querySelectorAll('.s').forEach(e=>e.classList.remove('a'));s.classList.add('a');sel=parseInt(id)};inv.appendChild(s)});function face(x,y,z,tx,ty,tz,bg){let f=document.createElement('div');f.className='f';f.style.background=bg;f.style.transform=`translate3d(${x}px,${y}px,${z}px) rotateX(${tx}deg) rotateY(${ty}deg) rotateZ(${tz}deg)`;return f}function draw(x,y,z,id){let k=`${x},${y},${z}`;if(M[k])M[k].remove();if(!id){delete M[k];return}let d=document.createElement('div');d.className='b';let c=types[id].c;d.appendChild(face(0,0,20,0,0,0,c));d.appendChild(face(0,0,-20,0,180,0,c));d.appendChild(face(-20,0,0,0,-90,0,c));d.appendChild(face(20,0,0,0,90,0,c));d.appendChild(face(0,-20,0,90,0,0,c));d.appendChild(face(0,20,0,-90,0,0,c));d.style.transform=`translate3d(${x}px,${y}px,${z}px)`;d.onmousedown=(e)=>{e.stopPropagation();if(e.button===0)draw(x,y,z,0);if(e.button===2){let nx=x,ny=y,nz=z;if(e.target.style.transform.includes('rotateY(90deg)'))nx+=W;if(e.target.style.transform.includes('rotateY(-90deg)'))nx-=W;if(e.target.style.transform.includes('rotateX(90deg)'))ny-=W;if(e.target.style.transform.includes('rotateX(-90deg)'))ny+=W;if(e.target.style.transform.includes('translateZ(20px)'))nz+=W;if(e.target.style.transform.includes('translateZ(-20px)'))nz-=W;draw(nx,ny,nz,sel)}};document.getElementById('c').appendChild(d);M[k]=d}document.addEventListener('contextmenu',e=>e.preventDefault());for(let x=-4;x<=4;x++)for(let z=-4;z<=4;z++){let h=Math.floor((Math.sin(x*0.5)+Math.cos(z*0.5))*1);for(let y=-2;y<=h;y++)draw(x*W,-(y*W),z*W,y==h?1:2);if(x===-2&&z===2){for(let th=1;th<=3;th++)draw(x*W,-((h+th)*W),z*W,4);for(let lx=-1;lx<=1;lx++)for(let lz=-1;lz<=1;lz++)draw((x+lx)*W,-((h+4)*W),(z+lz)*W,5)}if(x===2&&z===-2)draw(x*W,-(h*W),z*W,3)}window.onkeydown=e=>k[e.key.toLowerCase()]=1;window.onkeyup=e=>k[e.key.toLowerCase()]=0;let last=0;function loop(t){let s=2;if(k['w']){px-=s*Math.sin(ry*Math.PI/180);pz+=s*Math.cos(ry*Math.PI/180)}if(k['s']){px+=s*Math.sin(ry*Math.PI/180);pz-=s*Math.cos(ry*Math.PI/180)}if(k['a']){px-=s*Math.cos(ry*Math.PI/180);pz-=s*Math.sin(ry*Math.PI/180)}if(k['d']){px+=s*Math.cos(ry*Math.PI/180);pz+=s*Math.sin(ry*Math.PI/180)}if(k[' '])py-=s;if(k['shift'])py+=s;if(k['arrowleft'])ry-=1.5;if(k['arrowright'])ry+=1.5;if(k['arrowup'])rx=Math.min(90,rx+1.5);if(k['arrowdown'])rx=Math.max(-90,rx-1.5);Object.keys(M).forEach(k=>{let p=k.split(',').map(Number);if(M[k]&&p[1]===0&&Math.random()<0.005){let d=M[k];d.style.transform+=` translateY(${Math.sin(t*0.005)*2}px)`}});document.getElementById('c').style.transform=`rotateX(${rx}deg) rotateY(${ry}deg) translate3d(${-px}px,${-py}px,${-pz}px)`;requestAnimationFrame(loop)}requestAnimationFrame(loop);</script></body></html>
